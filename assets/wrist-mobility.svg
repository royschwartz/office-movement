<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Gentle wrist motion</title><desc id="desc">Close-up views show a supported forearm held still while the hand tips gently upward and downward at the wrist. The movement is small and unforced.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0,0 L 6,3 L 0,6" fill="#b06d42"/></marker></defs>
<rect width="600" height="380" fill="#f6f3ec"/>
<text x="155" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#223e37">TIP UP</text><text x="445" y="47" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#223e37">TIP DOWN</text><rect x="50" y="241" width="210" height="12" rx="6" fill="#e5ece4"/><rect x="340" y="241" width="210" height="12" rx="6" fill="#e5ece4"/><path d="M 99,220 L 179,220" fill="none" stroke="#223e37" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" /><path d="M 99,220 L 179,220" fill="none" stroke="#d9aa89" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M 177,209 Q 183,240 194,235 L 208,184 Q 211,171 201,171 L 186,173 Q 179,176 178,185 Z" fill="#d9aa89" stroke="#223e37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 187,195 L 192,177 M 195,197 L 199,178" fill="none" stroke="#b38668" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M 389,210 L 469,210" fill="none" stroke="#223e37" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" /><path d="M 389,210 L 469,210" fill="none" stroke="#d9aa89" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" /><path d="M 467,199 Q 473,190 484,195 L 498,246 Q 501,259 491,259 L 476,257 Q 469,254 468,245 Z" fill="#d9aa89" stroke="#223e37" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 477,235 L 482,253 M 485,233 L 489,252" fill="none" stroke="#b38668" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M 236,216 Q 258,185 223,168" fill="none" stroke="#b06d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 525,199 Q 552,230 518,252" fill="none" stroke="#b06d42" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="300" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#223e37">Keep your forearm still. Move only in an easy range.</text><text x="300" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#223e37">Then slowly open and close your hands.</text>
</svg>