<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Seated chest opening</title><desc id="desc">A person sits tall in a stable chair with feet planted and opens the arms out to the sides below shoulder height, palms forward. The shoulders stay relaxed and the back does not arch.</desc>
