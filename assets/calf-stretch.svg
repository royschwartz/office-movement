<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Standing calf stretch</title><desc id="desc">Side view of a person facing a wall with hands against it, one knee bent forward and the other leg extended behind. The back heel stays on the floor and both feet face toward the wall.</desc>
