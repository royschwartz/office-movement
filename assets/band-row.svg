<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Standing resistance band row</title><desc id="desc">Two three-quarter side views show a hip hinge with a long back, a resistance band securely underneath both shod feet, and pulling both hands toward the hips with elbows moving back. No furniture is used as an anchor.</desc>
