<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Wall arm slide</title><desc id="desc">Front views show standing with the back against a wall, arms bent in a W, then sliding upward toward a Y only as high as comfortable. The lower back stays easy rather than arched.</desc>
