29274416 Q 287.0,226.92137529274416 274.9860212186015,204.07862470725584 Z" fill="#204f46" stroke="#223e37" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M 345,141 L 411,164 L 411,111" fill="none" stroke="#223e37" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M 345,141 L 411,164 L 411,111" fill="none" stroke="#d9aa89" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M 345,141 L 379.98,153.19" fill="none" stroke="#223e37" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" /><path d="M 345,141 L 379.98,153.19" fill="none" stroke="#204f46" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><circle cx="411" cy="111" r="7" fill="#d9aa89" stroke="#223e37" stroke-width="1.3"/><text x="300" y="36" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#223e37">FOREARMS ON THE WALL</text><path d="M 232,295 L 288,217 L 342,151" fill="none" stroke="#a9b7aa" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><text x="125" y="126" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#223e37">Step back only</text><text x="125" y="143" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#223e37">as far as comfortable.</text><text x="300" y="353" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#223e37">A long body line. Keep breathing.</text>
