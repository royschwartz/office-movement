<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="title desc">
<title id="title">Standing forearm wall plank</title><desc id="desc">A side view shows forearms against a wall with elbows bent about ninety degrees. Feet are stepped back and the body forms a long line from shoulders through hips to ankles. Keep breathing.</desc>
<defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M 0,0 L 6,3 L 0,6" fill="#b06d42"/></marker></defs>
<rect width="600" height="380" fill="#f6f3ec"/>
